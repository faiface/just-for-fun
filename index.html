<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>just for fun</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2d241f; color: #fff8ec; font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 560px; width: 100%; }
    h1 { font-size: 32px; margin: 0 0 6px; }
    p { color: #e8d6bf; margin: 0 0 22px; }
    a.card { display: flex; gap: 16px; align-items: center; background: #fff8ec; color: #3c2b22; text-decoration: none; border-radius: 18px; padding: 16px 18px; box-shadow: 0 6px 0 #c9a983; }
    a.card:hover { transform: translateY(-2px); }
    .icon { font-size: 40px; }
    b { display: block; font-size: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>just for fun</h1>
    <p>Small things made for fun.</p>
    <a class="card" href="pinch-of-salt/"><span class="icon">🧂</span><span><b>A Pinch of Salt</b>A cozy home-cooking game: follow the recipe, cook it your way, and see what your guest thinks.</span></a>
  </main>
</body>
</html>
